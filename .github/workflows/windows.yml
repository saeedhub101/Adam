name: Adam Windows Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Phase 0 foundation files
        shell: pwsh
        run: |
          $required = @(
            "package.json",
            "src-tauri/Cargo.toml",
            "src-tauri/tauri.conf.json",
            "src-tauri/capabilities/default.json",
            "src-tauri/src/main.rs",
            "src-tauri/src/memory.rs",
            "src-tauri/src/permissions.rs",
            "src-tauri/src/calendar.rs",
            "docs/ARCHITECTURE.md"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing required Phase 0 file: $file" }
          }
      - name: Generate and commit frontend lockfile
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if (Test-Path "package-lock.json") {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if (-not (git diff --cached --quiet)) {
              git commit -m "chore: add reproducible npm lockfile"
              git push
            }
          }
      - name: Install frontend dependencies
        run: npm install
      - name: Svelte and TypeScript check
        run: npm run check
      - name: Frontend production build
        run: npm run build
      - name: Normalize Rust formatting
        shell: pwsh
        run: |
          cargo fmt --all --manifest-path src-tauri/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: normalize Rust formatting"
            git push
          }
      - name: Rust format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Tauri Windows production build
        run: npm run tauri build
      - name: Verify Phase 0/1 packaging configuration
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($config.bundle.publisher -ne "SaeedHub") { throw "Publisher configuration missing." }
          if (-not $config.bundle.windows.nsis.installerHooks) { throw "NSIS uninstall hook missing." }
          if ($config.bundle.windows.wix.upgradeCode -eq $null) { throw "Stable MSI upgradeCode missing." }
          if ($config.app.windows[0].transparent -ne $true) { throw "Transparent desktop window requirement missing." }
          if ($config.app.windows[0].alwaysOnTop -ne $true) { throw "Always-on-top requirement missing." }
          if ($config.app.windows[0].skipTaskbar -ne $true) { throw "Skip-taskbar requirement missing." }
          if (-not (Test-Path "src-tauri/windows/hooks.nsh")) { throw "NSIS hook file missing." }
      - name: Verify Windows installers
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          $msi = @(Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue)
          if ($nsis.Count -lt 1) { throw "NSIS installer was not produced." }
          if ($msi.Count -lt 1) { throw "MSI installer was not produced." }
          $nsis | Select-Object FullName,Length
          $msi | Select-Object FullName,Length
      - uses: actions/upload-artifact@v4
        with:
          name: Adam-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
