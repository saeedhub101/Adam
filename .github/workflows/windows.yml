name: Adam Windows Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Phase 0 foundation files
        shell: pwsh
        run: |
          $required = @(
            "package.json",
            "package-lock.json",
            "src-tauri/Cargo.toml",
            "src-tauri/tauri.conf.json",
            "src-tauri/capabilities/default.json",
            "src-tauri/src/main.rs",
            "src-tauri/src/memory.rs",
            "src-tauri/src/permissions.rs",
            "src-tauri/src/calendar.rs",
            "docs/ARCHITECTURE.md"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing required Phase 0 file: $file" }
          }
      - name: Install frontend dependencies
        run: npm ci
      - name: Svelte and TypeScript check
        run: npm run check
      - name: Frontend production build
        run: npm run build
      - name: Rust format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Tauri Windows production build
        run: npm run tauri build
      - name: Verify Phase 0/1 packaging configuration
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($config.bundle.publisher -ne "SaeedHub") { throw "Publisher configuration missing." }
          if (-not $config.bundle.windows.nsis.installerHooks) { throw "NSIS uninstall hook missing." }
          if ($config.bundle.windows.wix.upgradeCode -eq $null) { throw "Stable MSI upgradeCode missing." }
          if ($config.bundle.windows.wix.fragmentPaths.Count -lt 1) { throw "MSI cleanup fragment missing." }
          if ($config.bundle.windows.wix.componentRefs.Count -lt 3) { throw "MSI cleanup component references missing." }
          if ($config.app.windows[0].transparent -ne $true) { throw "Transparent desktop window requirement missing." }
          if ($config.app.windows[0].alwaysOnTop -ne $true) { throw "Always-on-top requirement missing." }
          if ($config.app.windows[0].skipTaskbar -ne $true) { throw "Skip-taskbar requirement missing." }
          if (-not (Test-Path "src-tauri/windows/hooks.nsh")) { throw "NSIS hook file missing." }
          if (-not (Test-Path "src-tauri/windows/fragments/cleanup.wxs")) { throw "MSI cleanup fragment file missing." }
          if (-not (Test-Path "src/lib/scene.ts")) { throw "Three.js scene module missing." }
          if (-not (Test-Path "src/App.svelte")) { throw "Desktop UI module missing." }
          if (-not (Select-String -Path "src/lib/scene.ts" -Pattern "FBXLoader" -Quiet)) { throw "FBX loader integration missing." }
          if (-not (Select-String -Path "src/lib/scene.ts" -Pattern "blinks|applyBlink" -Quiet)) { throw "Facial blink system missing." }
          if (-not (Select-String -Path "src/App.svelte" -Pattern "adam-character-library" -Quiet)) { throw "Persistent character library missing." }
          if (-not (Select-String -Path "src/App.svelte" -Pattern "Restore saved character" -Quiet)) { throw "Character restore UI missing." }

      - name: Verify Windows installers
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          $msi = @(Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue)
          if ($nsis.Count -lt 1) { throw "NSIS installer was not produced." }
          if ($msi.Count -lt 1) { throw "MSI installer was not produced." }
          $nsis | Select-Object FullName,Length
          $msi | Select-Object FullName,Length
      - name: Windows installer runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          $msi = (Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1).FullName

          function Stop-Adam {
            Get-Process -Name Adam -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }

          function Assert-NoAdamData {
            $paths = @(
              (Join-Path $env:APPDATA "com.saeedhub.adam"),
              (Join-Path $env:LOCALAPPDATA "com.saeedhub.adam"),
              (Join-Path $env:LOCALAPPDATA "Adam")
            )
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $remaining = @($paths | Where-Object { Test-Path $_ })
              if ($remaining.Count -eq 0) { return }
              Start-Sleep -Seconds 1
            }
            foreach ($p in $paths) {
              if (Test-Path $p) { throw "Adam user-data remained after uninstall: $p" }
            }
          }

          Start-Process -FilePath $nsis -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          $adamExe = Get-ChildItem $env:LOCALAPPDATA -Filter "Adam.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $adamExe) { throw "NSIS install did not produce Adam.exe." }
          $p = Start-Process -FilePath $adamExe.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Adam exited during NSIS runtime smoke test." }
          $p.Refresh()
          if ($p.MainWindowHandle -eq 0) { Write-Warning "Adam process is alive but exposes no native main window handle in this CI session." }
          Stop-Adam

          $uninstall = Get-ChildItem $env:LOCALAPPDATA -Filter "uninstall.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstall) { throw "NSIS uninstaller was not found." }
          Start-Process -FilePath $uninstall.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3
          Stop-Adam
          Assert-NoAdamData

          $msiLog = Join-Path $env:TEMP "Adam-msi-install.log"
          $proc = Start-Process msiexec.exe -ArgumentList @("/i", $msi, "/qn", "/norestart", "/L*v", $msiLog) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "MSI install failed with exit code $($proc.ExitCode)." }
          Start-Sleep -Seconds 5
          $adamExe = Get-ChildItem $env:LOCALAPPDATA -Filter "Adam.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $adamExe) { throw "MSI install did not produce Adam.exe." }
          $p = Start-Process -FilePath $adamExe.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Adam exited during MSI runtime smoke test." }
          $p.Refresh()
          if ($p.MainWindowHandle -eq 0) { Write-Warning "Adam process is alive but exposes no native main window handle in this CI session." }
          Stop-Adam

          $product = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq "Adam" } | Select-Object -First 1
          if (-not $product) { $product = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq "Adam" } | Select-Object -First 1 }
          if (-not $product) { throw "MSI uninstall registration for Adam was not found." }
          $proc = Start-Process msiexec.exe -ArgumentList @("/x", $product.PSChildName, "/qn", "/norestart") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($proc.ExitCode)." }
          Start-Sleep -Seconds 3
          Stop-Adam
          Assert-NoAdamData
          Write-Host "Windows installer runtime smoke test passed for NSIS and MSI."
          Write-Host "Phase 0/1 packaging, launch, persistence and uninstall gates passed."
      - uses: actions/upload-artifact@v4
        with:
          name: Adam-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
