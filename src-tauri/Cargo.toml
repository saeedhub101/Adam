[package]
name = "adam"
version = "0.1.0"
description = "Adam desktop AI assistant"
authors = ["saeedhub101"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-ico", "wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
keyring = { version = "3.6", features = ["windows-native"] }
tokio = { version = "1", features = ["sync", "macros"] }
[target."cfg(windows)".dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }
windows-core = "0.61"
